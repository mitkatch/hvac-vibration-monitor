# ============================================
# I2C and Sensors
# ============================================
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y

# ============================================
# Logging — USB CDC ACM virtual COM port
# BOARD_SERIAL_BACKEND_CDC_ACM enables the USB
# device stack and routes zephyr,console to the
# CDC ACM UART defined in the board DTS.
# Silence low-level USB driver noise so only
# application logs are visible.
# ============================================
CONFIG_LOG=y
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_UART_CONSOLE=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
CONFIG_USBD_LOG_LEVEL_OFF=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

# ============================================
# Stack Sizes (Thread needs more headroom)
# ============================================
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ============================================
# Floating point printf
# ============================================
CONFIG_CBPRINTF_FP_SUPPORT=y

# ============================================
# Multiprotocol Service Layer
# Required for 802.15.4 on nRF52840
# ============================================
CONFIG_MPSL=y

# ============================================
# Network stack (Thread is IPv6-only)
# ============================================
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
#CONFIG_NET_SOCKETS_POSIX_NAMES=y

# ============================================
# OpenThread — Minimal Thread Device (MTD)
# No routing; always-on receiver (MED mode)
# ============================================
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_DATASET_UPDATER=y
CONFIG_OPENTHREAD_COAP=y

# ============================================
# Entropy (OpenThread uses RNG internally)
# ============================================
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_NRF5_RNG=y

# ============================================
# Flash / NVS — OpenThread persists its
# active dataset across resets
# ============================================
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_RUNTIME=y

CONFIG_HVAC_SENSOR_NAME="hvac-furnace-1"

